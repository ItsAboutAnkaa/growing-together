function getSeason(d){
  const m=d.getMonth(),dd=d.getDate();
  if((m===2&&dd>=20)||m===3||m===4||(m===5&&dd<21))return'spring';
  if((m===5&&dd>=21)||m===6||m===7||(m===8&&dd<23))return'summer';
  if((m===8&&dd>=23)||m===9||m===10||(m===11&&dd<21))return'autumn';
  return'winter';
}
function getPhase(h){
  if(h>=5&&h<8)return'dawn';
  if(h>=8&&h<19)return'day';
  if(h>=19&&h<21)return'dusk';
  return'night';
}

function getMsg(rawDays, date){
  // Birthday: 1 July — special message pool
  if(date.getMonth()===6 && date.getDate()===1){
    const bdayMsgs=[
      'شما امر کن من اطاعت',
      'تولدت مبارک عشقم ✨',
      'امروز روز توئه، همیشه 💛',
      'هر روز بهتر از دیروز 🌺',
      'تو زیباترین فصل منی 🌸',
    ];
    const epoch=new Date(2000,0,1);
    const ds=Math.floor((date-epoch)/86400000);
    return bdayMsgs[ds % bdayMsgs.length];
  }
  if(MILESTONES[rawDays]) return MILESTONES[rawDays];
  if(date.getDate()===13 && date.getMonth()===4 && date.getFullYear()>2024){
    return 'Year '+(date.getFullYear()-2024)+' — still growing together 🌸';
  }
  if(rawDays>0 && rawDays%1000===0) return rawDays+' days of growing together 🌳';
  if(rawDays>0 && rawDays%500===0)  return rawDays+' days — rooted and strong';
  if(rawDays>0 && rawDays%100===0)  return rawDays+' days of quiet bloom 🌿';
  const epoch=new Date(2000,0,1);
  const ds=Math.floor((date-epoch)/86400000);
  return MSGS[ds % MSG_POOL % MSGS.length];
}

// ═══════════════════════════════════════════════════════════════════════════
//  DATE BREAKDOWN
// ═══════════════════════════════════════════════════════════════════════════
function breakdown(rawDays){
  const end=new Date(START.getTime()+rawDays*86400000);
  let y=end.getFullYear()-START.getFullYear();
  let mo=end.getMonth()-START.getMonth();
  let d=end.getDate()-START.getDate();
  if(d<0){mo--;d+=new Date(end.getFullYear(),end.getMonth(),0).getDate();}
  if(mo<0){y--;mo+=12;}
  const p=[];
  if(y>0) p.push(y+(y===1?' Year':' Years'));
  if(mo>0)p.push(mo+(mo===1?' Month':' Months'));
  if(d>0||p.length===0)p.push(d+(d===1?' Day':' Days'));
  return p.join(' • ');
}

function drawSky(season, phase, animT, daySeed){
  const p=SKY[season][phase];
  // Sky gradient
  const sg=skyX.createLinearGradient(0,0,0,H*0.65);
  sg.addColorStop(0,p.t); sg.addColorStop(1,p.b);
  skyX.fillStyle=sg; skyX.fillRect(0,0,W,H);
  // Moon
  if(p.moon){
    const mx=Math.round(W*.78), my=Math.round(H*.10);
    skyX.fillStyle='rgba(210,225,245,.28)'; skyX.beginPath(); skyX.arc(mx,my,20,0,Math.PI*2); skyX.fill();
    skyX.fillStyle='rgba(210,225,245,.10)'; skyX.beginPath(); skyX.arc(mx,my,30,0,Math.PI*2); skyX.fill();
    skyX.fillStyle='rgba(210,225,245,.05)'; skyX.beginPath(); skyX.arc(mx,my,42,0,Math.PI*2); skyX.fill();
  }
  // Stars
  if(p.stars){
    const seed=daySeed*13;
    for(let i=0;i<80;i++){
      const sx=((seed*137+i*373)%W);
      const sy=((seed*211+i*179)%(H*.55));
      const twinkle=.3+.7*((Math.sin(animT*Math.PI*2+i*.8)+1)/2);
      const bright=(i%7===0)?.9:.25+(i%3)*.15;
      skyX.fillStyle=`rgba(255,255,255,${bright*twinkle})`;
      skyX.fillRect(Math.round(sx),Math.round(sy),1,1);
      if(i%12===0){
        skyX.fillStyle=`rgba(255,255,255,${bright*twinkle*.3})`;
        skyX.fillRect(Math.round(sx)-1,Math.round(sy),3,1);
        skyX.fillRect(Math.round(sx),Math.round(sy)-1,1,3);
      }
    }
  }
  // Ground
  const gg=skyX.createLinearGradient(0,H*.60,0,H);
  gg.addColorStop(0,p.gt); gg.addColorStop(1,p.gb);
  skyX.fillStyle=gg; skyX.fillRect(0,H*.60,W,H);
}

// ═══════════════════════════════════════════════════════════════════════════
//  TREE PAINTER
// ═══════════════════════════════════════════════════════════════════════════
function px(n){return Math.round(n);}
function pxRect(ctx,x,y,w,h,c){
  ctx.fillStyle=c;
  ctx.fillRect(px(x),px(y),Math.max(1,px(w)),Math.max(1,px(h)));
}

function drawTree(progress, season, animT){
  treeX.clearRect(0,0,treeSize,treeSize);
  const pal=TREE_PAL[season];
  const ep=ease(Math.min(1,progress));
  const cx=px(treeSize/2), base=px(treeSize*.9);

  if(progress===0){ drawSprout(cx,base,pal,animT); return; }

  const trunkH=px(6+ep*(treeSize*.46));
  const trunkW=px(1+ep*9);
  // Big tree barely sways; sapling sways more
  const swayAmp=state.animations ? 1.8*(1-ep*.75) : 0;
  const sway=Math.sin(animT*.28)*swayAmp;

  // Roots
  if(ep>.25){
    const rc=px(2+ep*4);
    for(let i=0;i<rc;i++){
      const dir=i%2===0?1:-1;
      const len=px(ep*14);
      for(let r=0;r<len;r++){
        pxRect(treeX, cx+dir*(trunkW/2+r*.55), base+r*.35, 2, 1, r%2===0?pal.bark:pal.trunk);
      }
    }
  }
  // Trunk
  for(let y=0;y<trunkH;y++){
    const extra=y<trunkH*.1?(trunkH*.1-y)*.3:0;
    const w2=trunkW+extra;
    const ox=sway*(y/trunkH);
    pxRect(treeX, cx-w2/2+ox-1, base-y-1, w2+2, 2, pal.bark);
    pxRect(treeX, cx-w2/2+ox,   base-y,   w2,   1, pal.trunk);
    if(y%8===0&&ep>.3) pxRect(treeX,cx-w2/2+ox,base-y,1,1,'rgba(0,0,0,.15)');
  }

  const tipX=cx+sway*.9, tipY=base-trunkH;
  const maxD=Math.min(px(1.5+ep*4.5),5);
  const blen=3+ep*(treeSize*.17);
  const bc=px(1+ep*3);

  for(let i=0;i<bc;i++){
    const ratio=bc===1?.5:i/(bc-1);
    const sy2=tipY+px(trunkH*(.08+ratio*.55));
    const spread=(i-(bc-1)/2)*.6;
    branch(tipX,sy2,blen,Math.PI/2+spread,0,maxD,sway,ep,pal,animT,season);
  }
  branch(tipX,tipY,blen,Math.PI/2,0,maxD,sway,ep,pal,animT,season);
}

function branch(x,y,len,angle,depth,maxD,sway,ep,pal,animT,season){
  if(depth>maxD||len<1.5)return;
  const bs=sway*.06*(maxD-depth);
  const ex=x+Math.cos(angle)*len+bs;
  const ey=y-Math.sin(angle)*len;
  const bw=Math.max(1,px((maxD-depth+1)*.65));
  treeX.strokeStyle=depth<2?pal.bark:pal.trunk;
  treeX.lineWidth=bw;
  treeX.beginPath(); treeX.moveTo(px(x),px(y)); treeX.lineTo(px(ex),px(ey)); treeX.stroke();
  if(depth<maxD){
    const sp=.32+ep*.22;
    branch(ex,ey,len*.67,angle+sp,depth+1,maxD,sway,ep,pal,animT,season);
    branch(ex,ey,len*.67,angle-sp,depth+1,maxD,sway,ep,pal,animT,season);
    if(ep>.45&&depth<maxD-1) branch(ex,ey,len*.5,angle,depth+1,maxD,sway,ep,pal,animT,season);
  }
  if(depth>=maxD-1){
    const drift=state.animations?Math.sin(animT*.22+depth*1.3+angle)*.6*(1-ep*.5):0;
    const lc=px(2+ep*9), ls=Math.max(2,px(2+ep*5));
    for(let i=0;i<lc;i++){
      const lx=ex+Math.sin(i*2.3+angle)*ls*2.2+drift;
      const ly=ey+Math.cos(i*1.7+depth)*ls*2.2;
      pxRect(treeX,lx,ly,ls,ls,i%4===0?pal.leafL:pal.leaf);
      if(ep>.5&&i%5===0) pxRect(treeX,lx+1,ly+1,ls-1,ls-1,pal.leafL);
    }
    if(season==='spring'&&ep>.08){
      const fc=px(ep*4);
      for(let i=0;i<fc;i++){
        const fx=ex+Math.sin(i*3.1+animT*.12)*ls*1.5;
        const fy=ey+Math.cos(i*2.4+animT*.10)*ls*1.5;
        pxRect(treeX,fx,fy,3,3,pal.flower);
        pxRect(treeX,fx+1,fy+1,1,1,pal.flowerC);
      }
    }
    if(season==='winter'&&ep>.1){
      treeX.fillStyle='rgba(200,220,240,.5)';
      treeX.fillRect(px(ex-1),px(ey-1),3,1);
      treeX.fillRect(px(ex),px(ey-2),1,3);
    }
  }
}

function drawSprout(cx,base,pal,animT){
  const breathe=state.animations?Math.sin(animT*.35)*.5:0;
  const sw=state.animations?Math.sin(animT*.22)*.8:0;
  // Soil
  for(let i=-4;i<=4;i++) pxRect(treeX,cx+i*2-1,base,2,2,pal.soil);
  // Stem
  pxRect(treeX,cx-1,base-14,2,14,pal.bark);
  pxRect(treeX,cx-2,base-12,4,2,pal.bark);
  const st=base-14, lR=sw*.8, lL=-sw*.7;
  // Right leaf
  pxRect(treeX,cx+2+lR,st-8+breathe,4,3,pal.leaf);
  pxRect(treeX,cx+3+lR,st-10+breathe,3,2,pal.leaf);
  pxRect(treeX,cx+4+lR,st-11+breathe,2,2,pal.leaf);
  pxRect(treeX,cx+3+lR,st-9+breathe,2,2,pal.leafL);
  // Left leaf
  pxRect(treeX,cx-6+lL,st-6+breathe*.7,4,3,pal.leaf);
  pxRect(treeX,cx-7+lL,st-8+breathe*.7,3,2,pal.leaf);
  pxRect(treeX,cx-7+lL,st-9+breathe*.7,2,2,pal.leaf);
  pxRect(treeX,cx-6+lL,st-7+breathe*.7,2,2,pal.leafL);
  // Tip bud
  const tb=state.animations?Math.sin(animT*.30)*.4:0;
  pxRect(treeX,cx-1,st-5+tb,2,2,pal.leafL);
  pxRect(treeX,cx,st-7+tb,1,2,pal.leafL);
}

// ═══════════════════════════════════════════════════════════════════════════
//  PARTICLES
// ═══════════════════════════════════════════════════════════════════════════
const MAX_LEAVES=12,MAX_SNOW=20,MAX_PETALS=8,MAX_FIREFLIES=8,MAX_TOTAL=35;
let pool=[];

function tickParticles(season,phase,animT){
  pool=pool.filter(p=>p.life>.02&&p.y<H+12);
  pool.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy;
    if(p.ff) p.life=.5+.5*Math.sin(animT*2+p.phase);
    else p.life-=.0025;
  });
  if(!state.particles||pool.length>=MAX_TOTAL)return;
  const lc=pool.filter(p=>p.type==='leaf').length;
  const sc=pool.filter(p=>p.type==='snow').length;
  const pc=pool.filter(p=>p.type==='petal').length;
  const fc=pool.filter(p=>p.ff).length;
  const r=Math.random;
  if(season==='autumn'&&lc<MAX_LEAVES&&r()<.07) spawnLeaf();
  if(season==='winter'&&sc<MAX_SNOW&&r()<.09)   spawnSnow();
  if(season==='spring'&&pc<MAX_PETALS&&r()<.035) spawnPetal();
  if(season==='summer'&&phase==='night'&&fc<MAX_FIREFLIES&&r()<.012) spawnFirefly();
}
function spawnLeaf(){pool.push({x:Math.random()*W,y:-8,vx:(Math.random()-.5)*.9,vy:.5+Math.random()*.9,life:1,col:Math.random()<.5?'#c06818':'#e09020',sz:3,type:'leaf'});}
function spawnSnow(){pool.push({x:Math.random()*W,y:-5,vx:(Math.random()-.5)*.25,vy:.3+Math.random()*.5,life:1,col:Math.random()<.4?'#d8eef8':'#c0d8e8',sz:Math.random()<.25?2:1,type:'snow'});}
function spawnPetal(){pool.push({x:Math.random()*W,y:Math.random()*H*.5,vx:(Math.random()-.5)*.6,vy:-.25-Math.random()*.45,life:1,col:Math.random()<.6?'#ffb3c8':'#ffe0ea',sz:2,type:'petal'});}
function spawnFirefly(){pool.push({x:W*.1+Math.random()*W*.8,y:H*.4+Math.random()*H*.35,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.15,life:Math.random(),col:'#f0f060',sz:1,ff:true,phase:Math.random()*Math.PI*2});}

function drawParticles(){
  partX.clearRect(0,0,W,H);
  pool.forEach(p=>{
    const a=Math.max(0,p.life)*.88;
    if(p.ff){
      partX.fillStyle=`rgba(240,240,96,${p.life*.9})`;
      partX.fillRect(Math.round(p.x),Math.round(p.y),2,2);
      partX.fillStyle=`rgba(240,240,96,${p.life*.3})`;
      partX.fillRect(Math.round(p.x)-1,Math.round(p.y)-1,4,4);
    } else {
      partX.fillStyle=p.col;
      partX.globalAlpha=a;
      partX.fillRect(Math.round(p.x),Math.round(p.y),p.sz,p.sz);
      partX.globalAlpha=1;
    }
  });
}

function updateUI(rawDays, progress, season, phase, now){
  document.getElementById('dayNum').textContent=rawDays+' DAYS';

  document.getElementById('pbar').style.width=Math.min(100,pct)+'%';
  document.getElementById('badge').textContent=
    SEASON_LABELS[season]+' · '+PHASE_LABELS[phase];

  const msg=getMsg(rawDays, now);
  if(msg!==lastMsg){
    const el=document.getElementById('msgEl');
    el.style.opacity=0;
    setTimeout(()=>{ el.textContent='\u201c'+msg+'\u201d'; el.style.opacity=1; },350);
    lastMsg=msg;
  }
}

//  MAIN LOOP
// ═══════════════════════════════════════════════════════════════════════════
let animT=0;

// Midnight timer — updates automatically while app is open
function scheduleMidnight(){
  const now=new Date();
  const next=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
  setTimeout(()=>{ lastDay=-1; scheduleMidnight(); }, next-now);
}
scheduleMidnight();

// Resume on visibility change (tab/app back to foreground)
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible') lastDay=-1;
});

function loop(){
  animT+=0.018;

  const now=getRealNow();
  const season=getSeason(now);
  const phase=getPhase(now.getHours());
  const startMidnight=new Date(START.getFullYear(),START.getMonth(),START.getDate());
  const todayMidnight=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const rawDays=Math.max(0,Math.round((todayMidnight-startMidnight)/86400000));
  const progress=Math.min(1,rawDays/TOTAL_DAYS);

  // Birthday check — 1 July every year (دوست دخترت)
  const isBday = (now.getMonth()===6 && now.getDate()<= 30);

  drawSky(season,phase,animT,rawDays);
  tickParticles(season,phase,animT);
  drawParticles();
  drawTree(progress,season,animT);

  if(isBday){
    tickBdayFireworks();
    drawBdayFireworks();
    drawBdayCouple(animT);
  }

  updateUI(rawDays,progress,season,phase,now);

  // Show/hide birthday overlay
  const bdayOverlay=document.getElementById('bdayOverlay');
  const bdayText=document.getElementById('bdayText');
  const fwCanvas=document.getElementById('fwCanvas');
  if(isBday){
    bdayOverlay.style.display='block';
    bdayText.style.display='block';
    fwCanvas.style.display='block';
  } else {
    bdayOverlay.style.display='none';
    bdayText.style.display='none';
    fwCanvas.style.display='none';
  }

  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════════════════════════
//  BIRTHDAY SYSTEM
// ═══════════════════════════════════════════════════════════════════════════
const BDAY_COLS=['#ff4f8b','#ffe040','#5fc8ff','#7fff6a','#c87aff','#ff9928','#ffffa0','#40f8d8'];
let bdayFW=[], bdayFWTimer=0;
let coupleImg=null, coupleLoaded=false;

// Load couple image once
(function loadCouple(){
  const img=new Image();
  img.onload=()=>{coupleImg=img;coupleLoaded=true;};
  img.onerror=()=>{coupleLoaded=false;};
  img.src='couple.png';
})();

function spawnBdayFirework(){
  const W=window.innerWidth, H=window.innerHeight;
  const fx=W*0.05+Math.random()*W*0.90;
  const fy=H*0.03+Math.random()*H*0.38;
  const col=BDAY_COLS[Math.floor(Math.random()*BDAY_COLS.length)];
  const arms=30+Math.floor(Math.random()*10);
  const particles=[];
  for(let i=0;i<arms;i++){
    const angle=(i/arms)*Math.PI*2;
    const speed=1.4+Math.random()*2.8;
    particles.push({x:fx,y:fy,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:1,col,sz:Math.random()<0.25?3:2});
  }
  // sparkle trail
  for(let i=0;i<8;i++){
    const a=Math.random()*Math.PI*2;
    particles.push({x:fx,y:fy,vx:Math.cos(a)*(0.3+Math.random()),vy:Math.sin(a)*(0.3+Math.random()),life:1,col:'#ffffff',sz:1});
  }
  bdayFW.push({particles,cx:fx,cy:fy,col});
}

function tickBdayFireworks(){
  bdayFWTimer+=0.018;
  if(bdayFWTimer>1.6+Math.random()*0.8){bdayFWTimer=0;spawnBdayFirework();}
  bdayFW=bdayFW.filter(f=>f.particles.length>0);
  bdayFW.forEach(f=>{
    f.particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      p.vx*=0.96; p.vy=p.vy*0.96+0.05;
      p.life-=0.018;
    });
    f.particles=f.particles.filter(p=>p.life>0);
  });
}

function drawBdayFireworks(){
  const fc=document.getElementById('fwCanvas');
  if(!fc)return;
  const W=window.innerWidth,H=window.innerHeight;
  fc.width=W;fc.height=H;
  const ctx=fc.getContext('2d');
  ctx.clearRect(0,0,W,H);
  bdayFW.forEach(f=>{
    f.particles.forEach(p=>{
      ctx.globalAlpha=Math.max(0,p.life)*0.92;
      ctx.fillStyle=p.col;
      ctx.fillRect(Math.round(p.x),Math.round(p.y),p.sz,p.sz);
      if(p.sz>1){
        ctx.globalAlpha=Math.max(0,p.life)*0.28;
        ctx.fillRect(Math.round(p.x)-1,Math.round(p.y)-1,p.sz+2,p.sz+2);
      }
    });
    // centre glow
    ctx.globalAlpha=0.18;
    ctx.fillStyle=f.col;
    ctx.fillRect(Math.round(f.cx)-6,Math.round(f.cy)-6,12,12);
  });
  ctx.globalAlpha=1;
}

// Confetti pool (reused each frame)
const bdayConfetti=[];
for(let i=0;i<55;i++){
  bdayConfetti.push({
    x:Math.random()*800, y:Math.random()*900,
    vx:(Math.random()-.5)*0.55, vy:0.4+Math.random()*0.6,
    col:BDAY_COLS[Math.floor(Math.random()*BDAY_COLS.length)],
    sz:Math.random()<0.28?6:4,
    phase:Math.random()*Math.PI*2,
    heart:Math.random()<0.22,
  });
}

function drawBdayCouple(animT){
  const bc=document.getElementById('bdayCanvas');
  if(!bc)return;
  const W=window.innerWidth, H=window.innerHeight;
  bc.width=W; bc.height=H;
  const ctx=bc.getContext('2d');
  ctx.clearRect(0,0,W,H);

  // ── Confetti ────────────────────────────────────────────────
  bdayConfetti.forEach(c=>{
    c.x+=c.vx; c.y+=c.vy;
    if(c.y>H+10){c.y=-10;c.x=Math.random()*W;}
    const wx=Math.sin(animT*2.5+c.phase)*5;
    ctx.fillStyle=c.col;
    if(c.heart){
      const hx=Math.round(c.x+wx),hy=Math.round(c.y),s=c.sz;
      ctx.fillRect(hx,hy,s,s); ctx.fillRect(hx+s,hy,s,s);
      ctx.fillRect(hx-Math.floor(s/2),hy+s,s*3,s);
      ctx.fillRect(hx,hy+s*2,s*2,s);
    } else {
      ctx.fillRect(Math.round(c.x+wx),Math.round(c.y),c.sz,c.sz);
    }
  });

  // ── Couple image ─────────────────────────────────────────────
  if(!coupleLoaded || !coupleImg) return;

  // Scale couple to fit nicely — bottom of screen
  const targetH = Math.min(H*0.78, W*0.85);
  const ratio   = targetH / coupleImg.naturalHeight;
  const targetW = coupleImg.naturalWidth * ratio;
  const px      = (W - targetW) / 2;
  const py      = H - targetH - 5;

  // ── Dance: rotate only upper body of guy (right side, above table) ──
  // Approximate splits (ratio of couple image):
  const guyColStart = targetW * 0.50;   // guy starts 50% across
  const tableRow    = targetH * 0.46;   // table top at ~46% height

  // Draw girl + table + lower portion of guy (untouched)
  ctx.save();
  // Clip to everything EXCEPT guy's upper body
  ctx.beginPath();
  // Full rectangle minus top-right (guy upper body)
  ctx.rect(0, py, guyColStart+px, H);                          // left half full
  ctx.rect(px+guyColStart, py+tableRow, targetW, H);           // right half only below table
  ctx.clip();
  ctx.drawImage(coupleImg, px, py, targetW, targetH);
  ctx.restore();

  // Draw rotated upper body of guy on top
  const danceAngle = Math.sin(animT * 3.5) * 7 * (Math.PI/180); // oscillates ±7°
  const pivotX = px + guyColStart + (targetW - guyColStart)/2;
  const pivotY = py + tableRow;

  ctx.save();
  ctx.translate(pivotX, pivotY);
  ctx.rotate(danceAngle);
  ctx.translate(-pivotX, -pivotY);

  // clip to only guy's upper body region
  ctx.beginPath();
  ctx.rect(px + guyColStart, py, targetW - guyColStart, tableRow + 2);
  ctx.clip();
  ctx.drawImage(coupleImg, px, py, targetW, targetH);
  ctx.restore();

  // Candle warm glow over cake area
  const cakeCX = px + targetW * 0.46;
  const cakeCY = py + targetH * 0.52;
  const glow   = ctx.createRadialGradient(cakeCX,cakeCY,0,cakeCX,cakeCY,targetW*0.18);
  const gAlpha = 0.10 + Math.sin(animT*5)*0.03;
  glow.addColorStop(0, `rgba(255,160,40,${gAlpha})`);
  glow.addColorStop(1, 'rgba(255,160,40,0)');
  ctx.fillStyle=glow;
  ctx.fillRect(cakeCX-targetW*0.2, cakeCY-targetH*0.12, targetW*0.4, targetH*0.16);
}
loop();

function openRings(){
  const startMidnight=new Date(START.getFullYear(),START.getMonth(),START.getDate());
  const todayMidnight=new Date();todayMidnight.setHours(0,0,0,0);
  const rawDays=Math.max(0,Math.round((todayMidnight-startMidnight)/86400000));
  // Count completed years
  let completedYears=0;
  for(let y=1;y<=10;y++){
    const anniv=new Date(START.getFullYear()+y,START.getMonth(),START.getDate());
    if(todayMidnight>=anniv) completedYears=y;
  }
  const list=document.getElementById('ringsList');
  list.innerHTML='';
  for(let i=0;i<10;i++){
    const yr=i+1, done=yr<=completedYears, cur=yr===completedYears+1;
    list.innerHTML+=`
      <div class="ring-row">
        <div class="ring-dot${done?' done':cur?' current':''}">
          <span style="${done?'':'opacity:.3'}">${RING_ICONS[i]}</span>
        </div>
        <div class="ring-info">
          <div class="ring-yr${done?' done':''}">Year ${yr}</div>
          <div class="ring-lbl${done?' done':''}">${RING_LABELS[i]}</div>
        </div>
        ${done?'<span style="color:#ffc850;font-size:7px">●</span>':cur?'<span style="color:rgba(240,232,208,.3);font-size:10px">○</span>':''}
      </div>`;
  }
  document.getElementById('ringsPanel').classList.add('open');
  document.getElementById('overlay').classList.add('show');
}
